name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:smoke
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build --pull -t lab40:feature04 .
      - name: Executar container efêmero e validar
        run: |
          docker run -d --name lab40-container -p 3000:3000 lab40:feature04
          for i in $(seq 1 20); do curl --fail -s http://localhost:3000/health && break || sleep 1; done
          curl --fail http://localhost:3000/health
          curl --fail -X POST http://localhost:3000/api/features/4 \
            -H "Content-Type: application/json" \
            -d '{"valor":25,"origem":"C","destino":"F"}'
          docker logs lab40-container
          docker rm -f lab40-container
      - name: Exportar imagem
        run: docker save lab40:feature04 -o lab40-feature04.tar
      - uses: actions/upload-artifact@v4
        with:
          name: lab40-image
          path: lab40-feature04.tar
